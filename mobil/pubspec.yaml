name: midas_analist
description: BIST karar destek sistemi - Midas Analist mobil istemcisi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  cupertino_icons: ^1.0.8
  # Uygulama kilidinin PIN özeti için. Dart ekibinin resmî paketi, saf
  # Dart, yerel kod yok. Kendi SHA-256'sını yazmak yerine bunu almak
  # bilinçli: elle yazılmış kripto sessizce yanlış olur.
  crypto: ^3.0.3
  # Push bildirimi. google-services.json yoksa init sessizce başarısız
  # olur ve uygulama push'suz çalışmaya devam eder (bkz. servis/push.dart).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    # DejaVu Sans Mono (Bitstream Vera türevi, gömme serbest).
    # Neden mono: piksel/terminal görünümü sabit genişlik ister; ayrıca
    # sayı sütunları hizalanır — borsa ekranında okuma hızı buna bağlı.
    - family: Piksel
      fonts:
        - asset: assets/font/PixelMono-Regular.ttf
        - asset: assets/font/PixelMono-Bold.ttf
          weight: 700
