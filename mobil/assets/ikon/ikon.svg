<?xml version="1.0" encoding="UTF-8"?>
<!--
  Midas Analist — uygulama ikonu (kare / tam kanama).

  Tasarım kuralları tema.dart ile aynı, çünkü ikon uygulamanın ilk karesi:
    · YUVARLAKLIK YOK  — her köşe 90°, her kenar piksel ızgarasına oturur
    · GÖLGE YOK        — derinlik gölgeyle değil, kenarlıkla anlatılır
    · TEK AKSAN        — fosfor yeşili #A3E635; kırmızı yalnızca düşen mumda

  Neden mum: uygulamanın konusu bu. Dört mum — biri düşen, üçü yükselen —
  soldan sağa yükselen bir dizi, sonuncusu en parlak.

  Fitil kalınlığı 16/512: 48px'lik launcher ikonunda ~1,5px eder. 12 idi,
  o boyutta kayboluyordu. Küçük boy asıl sınavdır.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 512 512" shape-rendering="crispEdges">

  <rect width="512" height="512" fill="#0A0C0A"/>

  <!-- Izgara: terminal görünümü. Zeminden bir ton açık, okunmayacak kadar. -->
  <g fill="#161B12">
    <rect x="0" y="128" width="512" height="4"/>
    <rect x="0" y="256" width="512" height="4"/>
    <rect x="0" y="384" width="512" height="4"/>
  </g>

  <g fill="#FF5C5C">
    <rect x="110" y="300" width="16" height="104"/>
    <rect x="88" y="316" width="60" height="72"/>
  </g>
  <g fill="#A3E635" opacity="0.75">
    <rect x="202" y="252" width="16" height="120"/>
    <rect x="180" y="268" width="60" height="84"/>
  </g>
  <g fill="#A3E635" opacity="0.88">
    <rect x="294" y="184" width="16" height="136"/>
    <rect x="272" y="204" width="60" height="96"/>
  </g>
  <g fill="#A3E635">
    <rect x="386" y="100" width="16" height="172"/>
    <rect x="364" y="124" width="60" height="128"/>
  </g>

  <!-- Kenarlık en üstte: mumlar çerçeveyi kesmesin. -->
  <rect x="6" y="6" width="500" height="500" fill="none"
        stroke="#2C3626" stroke-width="12"/>
</svg>
